<body>
<header>
    <div class="heading">
        <h1>  Registration Form</h1>

    </div>

</header>
<form class="form">
<div class="info">
    <h1>Personal Information</h1>

    <div class="row">
        <div class="field">
            <label >Full Name</label>
            <input id="fullname" type="text" placeholder="Enter your full name">
        </div>

        <div class="field">
            <label >Father Name</label>
            <input id="fname" type="text" placeholder="Enter your father name">
        </div>
    </div>

    <div class="row">
        <div class="field">
            <label>Email</label>
            <input  id="email" type="email" placeholder="Enter email">
        </div>

        <div class="field">
            <label>Password</label>
            <input  id="password" type="password" placeholder="Enter password">
        </div>
    </div>

    <div class="row">
        <div class="field">
            <label id="pnumber">Phone Number</label>
            <input  id="pnumber" type="tel" placeholder="Enter phone number">
        </div>

        <div class="field">
            <label >Age</label>
            <input id="age" type="number" placeholder="Enter age">
        </div>
    </div>

    <div class="row">
        <div class="field">
            <label >Date of Birth</label>
            <input id="dob" type="date">
        </div>
         <div class="field">
        <button id="btn" type="button">Add Data</button>
        </div>
    </div>
</div>
  <div id="personalDetails">
          <h3>Your Personal Details</h3>
          <table class="table">
            <thead>
              <tr>
                <th scope="col">first Name</th>
                <th scope="col">Father Name</th>
                <th scope="col">Email</th>
                <th scope="col">Password</th>
                <th scope="col">Phone number</th>
                <th scope="col">Age</th>
                <th scope="col">Date of birth</th>
              </tr>
            </thead>
            <tbody id="personalTableBody">
              <tr>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
              </tr>
            </tbody>
          </table>
        </div>






<h2>Gender section</h2>

<div class="gender">
    <label>Gender:</label>

    <input type="radio" name="gender" id="male">
    <label for="male">Male</label>

    <input type="radio" name="gender" id="female">
    <label for="female">Female</label>
</div>

    <input type="checkbox" id="science">

</div>
